name: Forecast Ridge automatic update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = diagnóstico sin writes; run = ciclo normal elegible'
        required: true
        default: check
        type: choice
        options:
          - check
          - run

permissions:
  contents: read

# One production tenant/scenario in this repository. Worker lease/fencing also applies.
concurrency:
  group: forecast-ridge-production-minimarket-pasco-v3
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend production dependencies
        run: npm ci --prefix backend --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-forecast-worker.txt
      - name: Install worker Python dependencies
        run: python -m pip install -r ml/requirements-forecast-worker.txt
      - name: Select runner Python
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('FORECAST_TRAINING_PYTHON=' + sys.executable + '\n')
          PY
      - name: Read-only preflight
        timeout-minutes: 10
        env:
          FORECAST_CLOUD_MONGO_URI: ${{ secrets.FORECAST_CLOUD_MONGO_URI }}
          FORECAST_CLOUD_EXPECTED_DATABASE: ${{ secrets.FORECAST_CLOUD_EXPECTED_DATABASE }}
          FORECAST_CLOUD_EXPECTED_BUSINESS_ID: ${{ secrets.FORECAST_CLOUD_EXPECTED_BUSINESS_ID }}
          FORECAST_CLOUD_EXPECTED_SCENARIO_ID: ${{ secrets.FORECAST_CLOUD_EXPECTED_SCENARIO_ID }}
        run: node backend/scripts/run-v3-ridge-worker-cloud.js --check > "$RUNNER_TEMP/forecast-ridge-check.json"
      - name: Run eligible worker cycle
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        timeout-minutes: 10
        env:
          FORECAST_CLOUD_MONGO_URI: ${{ secrets.FORECAST_CLOUD_MONGO_URI }}
          FORECAST_CLOUD_EXPECTED_DATABASE: ${{ secrets.FORECAST_CLOUD_EXPECTED_DATABASE }}
          FORECAST_CLOUD_EXPECTED_BUSINESS_ID: ${{ secrets.FORECAST_CLOUD_EXPECTED_BUSINESS_ID }}
          FORECAST_CLOUD_EXPECTED_SCENARIO_ID: ${{ secrets.FORECAST_CLOUD_EXPECTED_SCENARIO_ID }}
        run: node backend/scripts/run-v3-ridge-worker-cloud.js --run > "$RUNNER_TEMP/forecast-ridge-run.json"
      - name: Sanitized execution summary
        if: always()
        run: node backend/scripts/forecast-ridge-actions-summary.js

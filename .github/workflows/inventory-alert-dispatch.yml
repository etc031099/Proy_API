name: Inventory alert dispatcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-alert-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    # Scheduled workflows run on the default branch. Keep manual runs there too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke dispatcher
        env:
          DISPATCH_SECRET: ${{ secrets.INVENTORY_ALERT_DISPATCH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DISPATCH_SECRET" ]]; then
            echo "::error::Repository secret INVENTORY_ALERT_DISPATCH_SECRET is not configured."
            exit 1
          fi

          status="$(curl --silent --show-error \
            --request POST \
            --url 'https://proy-api.onrender.com/api/internal/inventory-alert-dispatch/run' \
            --header "X-Internal-Secret: ${DISPATCH_SECRET}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --connect-timeout 20 \
            --max-time 110 \
            --output /dev/null \
            --write-out '%{http_code}')"

          echo "Dispatcher HTTP status: ${status}"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Dispatcher returned a non-2xx HTTP status."
            exit 1
          fi

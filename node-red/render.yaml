# Render Blueprint for the Node-RED integration demo.
# Usage: Render Dashboard > New > Blueprint > select this repo.
# NOTE: if this file is not at the repository root, create the Web Service
# manually and set "Root Directory" to the folder that contains this file.
services:
  - type: web
    name: node-red-billing
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_RED_ENABLE_EDITOR
        value: "false"
      - key: NODE_RED_CREDENTIAL_SECRET
        generateValue: true
      # Must match NODE_RED_WEBHOOK_SECRET in the backend service.
      - key: NODE_RED_WEBHOOK_SECRET
        sync: false
      # Protects the dashboard and any future HTTP nodes except /webhook.
      - key: NODE_RED_HTTP_USERNAME
        sync: false
      - key: NODE_RED_HTTP_PASSWORD
        sync: false
      # Base URL of your deployed backend API (with /api), e.g. https://xxxx.onrender.com/api
      - key: API_BASE
        sync: false
      # Credentials of an existing user of your system (used by Node-RED to get a JWT)
      - key: BILLING_EMAIL
        sync: false
      - key: BILLING_PASSWORD
        sync: false
      # Same Telegram bot token as the backend (Node-RED only REPLIES, no conflict)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
